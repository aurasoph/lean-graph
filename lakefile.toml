name = "leanGraph"
description = "Tools to analyse and visualise the import structure of Lean packages and their files."
license = "Apache-2.0"
licenseFiles = ["LICENSE"]

defaultTargets = ["LeanGraph", "graph"]

[[require]]
name = "Cli"
scope = "leanprover"
rev = "v4.29.0"

# For the minimal_export smoke test on a real (non-Mathlib, core-only) library.
[[require]]
name = "batteries"
scope = "leanprover-community"
rev = "v4.29.0"

[[lean_lib]]
name = "LeanGraph"

# `lake exe graph` constructs import graphs in `.dot` or graphical formats.
[[lean_exe]]
name = "graph"
root = "MainGraph"
# Enables the use of the Lean interpreter by the executable (e.g., `runFrontend`)
# at the expense of increased binary size on Linux.
# Remove this line if you do not need such functionality.
supportInterpreter = true

# `lake exe unused_transitive_imports` prints unused transitive imports from amongst a given list of modules.
[[lean_exe]]
name = "unused_transitive_imports"
root = "MainUnusedTransitiveImports"
supportInterpreter = true

# `lake exe export_statements` exports declaration signatures to JSONL for LLM-based processing.
[[lean_exe]]
name = "export_statements"
root = "MainExportStatements"
supportInterpreter = true

# `lake exe minimal_export` emits a self-contained file with a target's closure.
[[lean_exe]]
name = "minimal_export"
root = "MainMinimalExport"
supportInterpreter = true

# `lake exe test` runs the comprehensive test suite.
[[lean_exe]]
name = "test"
root = "MainTest"
supportInterpreter = true

[[lean_lib]]
name = "LeanGraphTest"

# Small Core-Lean-only target for exercising the minimal-library exporter.
[[lean_lib]]
name = "TestTarget"

[[lean_lib]]
name = "TestTarget2"

[[lean_lib]]
name = "TestTarget3"
